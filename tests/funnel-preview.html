<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funil simplificado · dados fictícios</title><link rel="stylesheet" href="../cloud/funnel.css?v=1"><style>:root{--surface:#13131a;--card:#1a1a24;--raised:#20202e;--line:#ffffff12;--line2:#ffffff20;--sub:#aaaab6;--hint:#858592}*{box-sizing:border-box}body{background:#0c0c10;color:#eee;font:14px/1.6 system-ui;margin:0;padding:20px}.panel{max-width:1180px;margin:20px auto;padding:20px;border:1px solid var(--line2);border-radius:12px;background:var(--card)}.demo{max-width:1180px;margin:auto;padding:14px;background:#ff8b380a;border:1px solid #ff8b3840;border-radius:9px;font-size:12px}.panel-title{font-size:16px;font-weight:750}.kanban-hint{font-size:12px;color:var(--sub)}select{width:100%;min-height:44px;background:var(--raised);color:#eee;border:1px solid var(--line2);border-radius:7px;padding:8px}label{display:block;color:var(--sub);font-size:12px}#demoRole{width:auto;margin-left:10px}#demoDetail{max-width:1180px;margin:auto;color:#ffb27b}</style><body><header class="demo"><b>TESTE ISOLADO · DADOS FICTÍCIOS</b><p>Nenhum acesso ao banco, envio de WhatsApp ou alteração de clientes reais.</p><label>Simular papel<select id="demoRole"><option value="staff">Vendedora</option><option value="admin">Gestor</option></select></label></header><main id="tab-funil" class="active"><section class="panel"><div class="panel-title">Funil de vendas · visão simplificada</div><p class="kanban-hint">As etapas detalhadas ficam nas etiquetas e no atendimento.</p><div id="kanbanBoard"></div></section></main><p id="demoDetail" role="status"></p><script>
const STATUS_CFG={novo:{label:'Não contatado'},contatado:{label:'Aguardando resposta'},interesse:{label:'Interessado'},qualificado:{label:'Qualificado'},proposta:{label:'Proposta enviada'},fechado:{label:'Fechado'},nao:{label:'Sem interesse'},invalido:{label:'Número errado'}};
let resultados=[{nome:'Contato livre · Exemplo',telNum:'11900000000',tel:'11900000000'},{nome:'Duplicado antigo · teste',telNum:'11900000010'}],HISTORICO={};
Object.keys(STATUS_CFG).forEach((status,i)=>{const tel='1190000001'+i;HISTORICO[tel]={nome:['Empresa nova','Academia em conversa','Escritório interessado','Kit em análise','Proposta para evento','Pedido confirmado','Recusa registrada','Destino incorreto'][i]+' · Exemplo',telNum:tel,tel,status,ownerId:'demo-seller',ownerName:'Vendedora de teste',nextAction:i===1?'Confirmar quantidade':i===3?'Validar condições':i===4?'Acompanhar decisão':'',nextActionOwner:i===3?'manager':'seller',followUp:i===1?'2026-10-15':'',quoteState:i===3?'requested':i===4?'sent':'',closeReason:status==='nao'?'nao_contatar':status==='invalido'?'numero':''};});
HISTORICO['11900000018']={nome:'Outro responsável · Exemplo',telNum:'11900000018',status:'interesse',ownerId:'other',ownerName:'Outra pessoa de teste'};
window.prospectUser={id:'demo-seller',name:'Vendedora de teste'};window.prospectRole='staff';
function renderKanban(){}window.refreshWorkflow=()=>{};
function showToast(t){document.getElementById('demoDetail').textContent=t;}
window.openLeadWorkflow=t=>showToast('Teste: abrir ficha do contato '+t+'. Nenhum dado foi alterado.');
window.cloudSync={claim:async t=>{const h=HISTORICO[t]||resultados.find(x=>x.telNum===t);h.ownerId=window.prospectUser.id;h.ownerName=window.prospectUser.name;renderKanban();}};
document.getElementById('demoRole').onchange=e=>{window.prospectRole=e.target.value;window.prospectUser=e.target.value==='admin'?{id:'demo-manager',name:'Gestor de teste'}:{id:'demo-seller',name:'Vendedora de teste'};renderKanban();};
</script><script src="../cloud/funnel-model.js?v=1"></script><script src="../cloud/funnel.js?v=1"></script><script>renderKanban();</script></body></html>
